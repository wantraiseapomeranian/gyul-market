# PERF-1 측정 신뢰성 진단을 GitHub 호스트 러너에서 실행한다(로컬 PC와 다른 환경의 기준값).
# 합격 판정은 하지 않는다. 결과는 아티팩트 perf-diag(JSON 2개).
name: perf-diag

on:
  workflow_dispatch:
    inputs:
      runs:
        description: 방식별 반복 수
        default: '10'
  pull_request:
    paths:
      - tests/perf-diag.spec.ts
      - .github/workflows/perf-diag.yml

permissions:
  contents: read

jobs:
  perf-diag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: nproc; free -m
      - run: npx playwright test tests/perf-diag.spec.ts --project=m390 --workers=1
        env:
          PERF_DIAG: '1'
          PERF_RUNS: ${{ inputs.runs || '10' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-diag
          path: test-results/perf-diag-*.json
